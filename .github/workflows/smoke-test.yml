name: NBA agent smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q nba_agent run.py
      - name: Run offline demo
        run: python run.py demo
      - name: Run live NBA data cycle (when API key is configured)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p reports
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::notice::ODDS_API_KEY is not configured; skipping live cycle."
            exit 0
          fi
          set -o pipefail
          python -u run.py cycle 2>&1 | tee reports/live-cycle.log
      - name: Verify live ingestion wrote historical data
        if: env.ODDS_API_KEY != ''
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("nba_agent.db")
          counts = {
              "player_logs": db.execute("SELECT COUNT(*) FROM player_logs").fetchone()[0],
              "events": db.execute("SELECT COUNT(*) FROM events").fetchone()[0],
              "odds_snapshots": db.execute("SELECT COUNT(*) FROM odds_snapshots").fetchone()[0],
          }
          print("Live database row counts:", counts)
          if counts["player_logs"] == 0:
              raise SystemExit("Live ingestion failed: no historical player logs were stored.")
          PY
      - name: Upload live run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-agent-live-run
          path: |
            reports/
            nba_agent.db
          if-no-files-found: ignore
          retention-days: 7
